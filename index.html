<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>coldworld2000</title>
    <style>
      html {
        height: 100%;
        overflow: hidden;
        background: #fff;
        touch-action: pan-x pan-y;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        position: fixed;
        inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #fff;
        color: #111;
        font-family: Arial, sans-serif;
        touch-action: pan-x pan-y;
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      :root { --soft-border: #f2f3f4; --soft-glow: 0 7px 24px #343d4a0d; --soft-glow-small: 0 5px 18px #343d4a0b; }
      .workspace {
        width: min(100%, 720px);
        height: 100%;
        height: 100dvh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
      }
      .toolbar { display: flex; align-items: center; gap: 12px; flex-shrink: 0; position: relative; z-index: 2; margin-bottom: 32px; }
      .word-entry { display: flex; align-items: center; flex: 1; min-width: 0; }
      .add-slot {
        width: 0;
        flex-shrink: 0;
        opacity: 0;
        visibility: hidden;
        transform: scale(.8);
        transition: width 280ms ease, opacity 200ms ease, transform 280ms ease, visibility 280ms;
      }
      .word-entry.has-word .add-slot {
        width: 66px;
        opacity: 1;
        visibility: visible;
        transform: scale(1);
      }
      .add-button {
        width: 54px;
        margin-left: 12px;
        padding: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        -webkit-tap-highlight-color: transparent;
        transition: transform 180ms ease, border-color 220ms ease, box-shadow 220ms ease;
      }
      .add-button:active {
        transform: scale(.96);
        border-color: #e1e4e8;
        box-shadow: 0 0 12px #333d4b0c;
      }
      @media (prefers-reduced-motion: reduce) {
        .add-slot, .add-button { transition: none; }
        .add-button:active { transform: none; }
      }
      .word-input, .profile-button, .add-button {
        height: 54px;
        border: 1px solid var(--soft-border);
        background: #fff;
        box-shadow: var(--soft-glow);
      }
      .word-input {
        width: 100%;
        min-width: 0;
        padding: 0 20px;
        border-radius: 20px;
        font: inherit;
        font-size: 16px;
        color: #24272b;
        transition: border-color 220ms ease, box-shadow 220ms ease;
      }
      .word-input:focus {
        outline: none;
        box-shadow: 0 8px 28px #343d4a12;
      }
      .word-input::placeholder { color: #85898f; }
      .profile { position: relative; flex-shrink: 0; }
      .word-count {
        position: absolute;
        top: 62px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 5px;
        color: #737982;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .word-list {
        list-style: none;
        position: fixed;
        top: 130px;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        padding: 36px max(20px, calc((100vw - 680px) / 2)) max(44px, env(safe-area-inset-bottom));
        margin: 0;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        display: grid;
        align-content: start;
        gap: 10px;
        scrollbar-width: none;
        /* Карточки мягко растворяются в фоне у границ списка. */
        -webkit-mask-image: linear-gradient(to bottom, transparent, #000 36px, #000 calc(100% - 44px), transparent);
        mask-image: linear-gradient(to bottom, transparent, #000 36px, #000 calc(100% - 44px), transparent);
      }
      .word-list::-webkit-scrollbar { display: none; }
      .word-list-divider { display: flex; align-items: center; gap: 14px; margin: 18px 2px 8px; color: #92979e; font-size: 12px; }
      .word-list-divider::before, .word-list-divider::after { content: ''; height: 1px; flex: 1; background: linear-gradient(to right, transparent, #e9ebed); }
      .word-list-divider::after { background: linear-gradient(to left, transparent, #e9ebed); }
      .category-strip { display: flex; align-items: center; justify-content: center; flex-shrink: 0; min-height: 38px; margin: 0 0 12px; }
      .category-chip { flex-shrink: 0; border: 1px solid #f2f3f4; border-radius: 999px; background: #fff; color: #737982; padding: 8px 13px; font-size: 13px; white-space: nowrap; box-shadow: 0 5px 18px #343d4a0a; }
      .category-chip[aria-pressed="true"] { color: #252a30; box-shadow: 0 5px 22px #343d4a12; }
      .category-open { min-width: 144px; padding: 9px 18px; border: 1px solid #f3f4f5; border-radius: 999px; background: #fff; box-shadow: 0 6px 22px #343d4a10; color: #62676e; font: inherit; font-size: 13px; transition: box-shadow 180ms ease, transform 180ms ease; }
      .category-open:active { transform: scale(.97); box-shadow: 0 3px 14px #343d4a0d; }
      .category-manager { position: fixed; inset: 0; z-index: 4; background: #fff; }
      .category-manager:not([hidden]) { animation: profile-appear 240ms ease-out both; }
      .category-actions { display: flex; justify-content: flex-end; gap: 12px; flex-shrink: 0; margin-bottom: 24px; }
      .category-title { margin: 0 0 22px; text-align: center; font-size: 28px; font-weight: 400; }
      #category-rows { min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 8px 0 max(28px, env(safe-area-inset-bottom)); }
      #category-rows::-webkit-scrollbar { display: none; }
      .category-create { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 20px; background: #fff9; backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px); }
      .category-create-panel { width: min(100%, 360px); padding: 18px; border: 1px solid #f2f3f4; border-radius: 22px; background: #fff; box-shadow: 0 14px 46px #343d4a16; }
      .category-form { display: flex; gap: 8px; }
      .category-form input { min-width: 0; flex: 1; height: 42px; padding: 0 14px; border: 1px solid var(--soft-border); border-radius: 14px; background: #fff; box-shadow: var(--soft-glow-small); font: inherit; font-size: 17px; transition: box-shadow 180ms ease; }
      .category-form input:focus { outline: none; box-shadow: 0 8px 28px #343d4a12; }
      .category-form button, .category-remove { display: grid; place-items: center; flex: 0 0 42px; width: 42px; height: 42px; padding: 0; border: 1px solid #f2f3f4; border-radius: 14px; background: #fff; color: #62676e; box-shadow: 0 6px 20px #343d4a0e; }
      .category-form button:active, .category-remove:active { transform: scale(.96); }
      .category-row { display: grid; grid-template-columns: 42px minmax(0, 1fr) 42px; align-items: center; gap: 8px; min-height: 50px; padding: 4px 0; }
      .category-choice { grid-column: 2; justify-self: center; width: 100%; padding: 10px 8px; border: 1px solid var(--soft-border); border-radius: 14px; background: #fff; color: #62676e; box-shadow: var(--soft-glow-small); font: inherit; font-size: 15px; overflow-wrap: anywhere; }
      .category-choice[aria-pressed="true"] { background: #fafbfc; color: #252a30; box-shadow: 0 6px 22px #343d4a0d; }
      .category-form { margin: 0; }
      .word-categories { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .word-categories .category-chip { max-width: 100%; overflow-wrap: anywhere; white-space: normal; text-align: center; }
      .word-card {
        padding: 18px 20px;
        border: 1px solid var(--soft-border);
        border-radius: 20px;
        background: #fff;
        box-shadow: var(--soft-glow);
        color: #34383e;
        font-size: 17px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .word-card.is-new { animation: word-appear 300ms ease both; }
      @keyframes word-appear {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .word-card.is-new { animation: none; }
      }
      button { font: inherit; color: inherit; cursor: pointer; }
      .profile-button {
        width: 54px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        padding: 4px;
        color: #62676e;
      }
      .profile-button:disabled { cursor: wait; opacity: .5; }
      .profile-button > * { grid-area: 1 / 1; }
      :focus-visible { outline: 2px solid #dce0e4; outline-offset: 2px; }
      .profile-button img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
      .profile-menu {
        position: absolute;
        top: 88px;
        right: 0;
        width: 230px;
        padding: 16px;
        border: 1px solid var(--soft-border);
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 10px 34px #343d4a12;
        z-index: 1;
      }
      .profile-name { margin: 0 0 12px; overflow-wrap: anywhere; font-size: 14px; }
      .profile-menu:not([hidden]) { animation: profile-appear 240ms ease-out both; }
      @keyframes profile-appear {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .profile-menu:not([hidden]) { animation: none; }
      }
      .profile-intro { display: block; margin-bottom: 5px; color: #85898f; font-size: 11px; }
      .signout { border: 1px solid var(--soft-border); border-radius: 12px; background: #f4f5f6; padding: 10px 14px; width: 100%; box-shadow: var(--soft-glow-small); }
      .status { flex-shrink: 0; margin: 0 4px 12px; color: #62676e; font-size: 13px; line-height: 1.5; }
      #sync-status { text-align: center; }
      .word-link { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
      .word-link > span { min-width: 0; }
      .word-translation { color: #85898f; font-size: 14px; }
      #word-details { display: grid; gap: 12px; margin-top: 12px; }
      #word-details:empty { display: none; }
      .detail-section { padding: 18px; border: 1px solid var(--soft-border); border-radius: 18px; background: #f7f8f9; box-shadow: var(--soft-glow-small); }
      .word-category-section { margin-top: 24px; }
      .detail-section h2 { margin: 0 0 12px; color: #85898f; font-size: 12px; font-weight: 400; }
      .detail-section p { margin: 8px 0; font-size: 15px; line-height: 1.7; overflow-wrap: anywhere; }
      .detail-section .detail-note { color: #85898f; font-size: 13px; }
      .word-example { padding: 14px; border: 1px solid var(--soft-border); border-radius: 14px; background: #fff; box-shadow: 0 5px 18px #343d4a09; }
      .word-example + .word-example { margin-top: 10px; }
      .detail-section .example-korean { font-size: 18px; color: #24272b; }
      .word-action:disabled { opacity: .45; cursor: wait; }
      .word-action.is-loading { animation: translation-pulse 1200ms ease-in-out infinite; }
      @keyframes translation-pulse { 50% { opacity: .8; box-shadow: 0 0 12px #333d4b15; } }
      @media (prefers-reduced-motion: reduce) { .word-action.is-loading { animation: none; } }
      [hidden] { display: none !important; }
      .word-card { display: flex; align-items: center; padding: 0; }
      .word-link { flex: 1; min-width: 0; padding: 18px 20px; border: 0; border-radius: inherit; background: transparent; text-align: left; overflow-wrap: anywhere; line-height: inherit; }
      .quick-translate { display: grid; place-items: center; flex: 0 0 38px; width: 38px; height: 38px; margin-right: 12px; padding: 0; border: 1px solid var(--soft-border); border-radius: 50%; background: #fff; color: #737982; box-shadow: var(--soft-glow-small); }
      .quick-category { display: grid; place-items: center; flex: 0 0 38px; width: 38px; height: 38px; margin-right: 12px; padding: 0; border: 1px solid var(--soft-border); border-radius: 50%; background: #fff; color: #737982; box-shadow: var(--soft-glow-small); transition: transform 180ms ease, box-shadow 180ms ease; }
      .quick-category:active { transform: scale(.96); box-shadow: 0 3px 14px #343d4a0d; }
      .quick-category:disabled { opacity: .5; cursor: wait; }
      .quick-translate:disabled { opacity: .5; cursor: wait; }
      .quick-translate.is-loading { animation: translation-pulse 1200ms ease-in-out infinite; }
      .word-page { position: fixed; inset: 0; background: #fff; z-index: 3; }
      .word-page:not([hidden]) { animation: profile-appear 240ms ease-out both; }
      .word-actions { display: flex; justify-content: flex-end; gap: 12px; flex-shrink: 0; margin-bottom: 32px; }
      .word-action { width: 48px; height: 48px; display: grid; place-items: center; border: 1px solid var(--soft-border); border-radius: 50%; background: #fff; box-shadow: var(--soft-glow); color: #62676e; transition: transform 180ms ease, box-shadow 220ms ease; -webkit-tap-highlight-color: transparent; }
      .word-action:active { transform: scale(.96); box-shadow: 0 0 12px #333d4b0c; }
      .word-content { overflow-y: auto; min-height: 0; padding-bottom: max(24px, env(safe-area-inset-bottom)); scrollbar-width: none; }
      .word-content::-webkit-scrollbar { display: none; }
      .word-title { margin: 0; text-align: center; font-size: 30px; font-weight: 400; line-height: 1.4; overflow-wrap: anywhere; }
      @media (prefers-reduced-motion: reduce) {
        .word-page:not([hidden]) { animation: none; }
        .word-action { transition: none; }
        .word-action:active { transform: none; }
      }
    </style>
  </head>
  <body>
    <main class="workspace">
      <div class="toolbar">
        <div class="word-entry" id="word-entry">
          <input class="word-input" id="new-word" type="text" placeholder="Новое слово" aria-label="Новое слово" autocomplete="off" spellcheck="false" maxlength="120" enterkeyhint="done">
          <div class="add-slot" id="add-slot" inert>
            <button class="add-button" type="button" aria-label="Добавить слово" title="Добавить слово">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
              </svg>
            </button>
          </div>
        </div>
        <div class="profile">
          <button class="profile-button" id="profile-button" type="button" aria-label="Войти через Google" title="Войти через Google" disabled>
            <svg id="profile-icon" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" />
              <path d="M5 21v-2a7 7 0 0 1 14 0v2" stroke-linecap="round" />
            </svg>
            <img id="profile-avatar" alt="" referrerpolicy="no-referrer" hidden>
            <span id="profile-initial" hidden></span>
          </button>
          <div class="word-count" id="word-count" role="status" aria-label="Добавлено слов: 0" title="Добавлено слов">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path d="M4 4h6a3 3 0 0 1 2 1 3 3 0 0 1 2-1h6v15h-6a3 3 0 0 0-2 1 3 3 0 0 0-2-1H4zM12 5v15" />
            </svg>
            <span id="word-count-value">0</span>
          </div>
          <div class="profile-menu" id="profile-menu" hidden>
            <p class="profile-name"><span class="profile-intro">my name is</span><span id="profile-name"></span></p>
            <button class="signout" id="signout" type="button">Выйти</button>
          </div>
        </div>
      </div>
      <p class="status" id="auth-status" role="status" hidden></p>
      <button class="signout" id="import-local" type="button" hidden>Сохранить слова с устройства в аккаунт</button>
      <p class="status" id="word-status" role="status" hidden></p>
      <nav class="category-strip" id="category-strip" aria-label="Категории слов"><button class="category-open" id="category-open" type="button" aria-haspopup="dialog" aria-expanded="false">Категории</button></nav>
      <p class="status" id="sync-status" role="status" hidden></p>
      <ul class="word-list" id="word-list" aria-label="Словарь" tabindex="-1"></ul>
    </main>
    <section class="category-manager" id="category-manager" aria-labelledby="category-heading" hidden>
      <div class="workspace">
        <nav class="category-actions" aria-label="Действия с категориями">
          <button class="word-action" id="category-new" type="button" aria-label="Добавить категорию"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg></button>
          <button class="word-action" id="category-close" type="button" aria-label="Закрыть категории"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg></button>
        </nav>
        <h1 class="category-title" id="category-heading">Категории</h1>
        <p class="status" id="category-status" role="status" hidden></p>
        <div id="category-rows"></div>
      </div>
    </section>
    <div class="category-create" id="category-create" hidden>
      <section class="category-create-panel" role="dialog" aria-modal="true" aria-label="Новая категория">
        <form class="category-form" id="category-form">
          <input id="category-name" type="text" maxlength="40" placeholder="Название категории" aria-label="Название категории">
          <button type="submit" aria-label="Создать категорию"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg></button>
        </form>
      </section>
    </div>
    <section class="word-page" id="word-page" aria-labelledby="word-title" hidden>
      <div class="workspace">
        <nav class="word-actions" aria-label="Действия со словом">
          <button class="word-action" id="translate-word" type="button" aria-label="Перевести слово" title="Перевести слово">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h12M9 3v2M12 5c-1 6-4 9-9 11M5 8c1 3 4 6 7 7M13 21l4-10 4 10M14.5 17h5" /></svg>
          </button>
          <button class="word-action" id="delete-word" type="button" aria-label="Удалить слово" title="Удалить слово">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5" /></svg>
          </button>
          <button class="word-action" id="close-word" type="button" aria-label="Закрыть страницу слова" title="Закрыть">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </nav>
        <p class="status" id="word-page-status" role="status" hidden></p>
        <div class="word-content"><h1 class="word-title" id="word-title"></h1><div class="detail-section word-category-section"><h2>Категория</h2><div class="word-categories" id="word-category" role="group" aria-label="Категория слова"></div></div><div id="word-details"></div></div>
      </div>
    </section>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./dictionary.js"></script>
    <script>
      // Safari может игнорировать запрет масштабирования из viewport при жесте двумя пальцами.
      document.addEventListener('gesturestart', event => event.preventDefault(), { passive: false });
      // После публикации сверяем версию, чтобы телефон не оставался на старом коде.
      const siteVersion = '__BUILD_VERSION__';
      async function checkSiteVersion() {
        if (siteVersion.startsWith('__')) return;
        try {
          const response = await fetch(`./version.txt?t=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) return;
          const latest = (await response.text()).trim();
          if (latest && latest !== siteVersion && new URLSearchParams(location.search).get('v') !== latest) {
            const url = new URL(location.href);
            url.searchParams.set('v', latest);
            location.replace(url);
          }
        } catch { /* Без сети остаёмся на доступной версии. */ }
      }
      checkSiteVersion();
      document.addEventListener('visibilitychange', () => { if (!document.hidden) checkSiteVersion(); });
    </script>
  </body>
</html>
